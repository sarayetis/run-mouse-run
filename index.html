<canvas id="c"></canvas>
<script>
(() => {
  'use strict';
  const W = 960, H = 540, GROUND = 440;
  const INK = '#2b1a12';
  const FONT = '"RMR","Comic Sans MS","Chalkboard SE","Marker Felt",cursive';
  try { document.fonts.load('21px RMR'); document.fonts.load('bold 21px RMR'); } catch (e) {}   // gömülü yazı tipini hemen hazırla
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---------- Ses: hepsi Web Audio ile kodla üretilir ----------
  const Snd = (() => {
    let ac = null, master, musicG, sfxG, noiseBuf, muted = false, musicOn = false, timer = null, nextT = 0, step = 0, lvl = 1;
    try { muted = localStorage.getItem('rmr-muted') === '1'; } catch (e) {}
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    // 4 ölçülük, sinsi-neşeli "kovalamaca" döngüsü (C - Am - F - G7)
    const BASS = [[36, 40, 43, 40], [33, 36, 40, 36], [41, 45, 48, 45], [43, 47, 50, 47]];
    const CH = [[60, 64, 67], [57, 60, 64], [57, 60, 65], [59, 62, 65, 67]];
    const MEL = [[72, 0, 76, 0, 79, 76, 72, 0], [69, 0, 72, 0, 76, 72, 69, 70], [65, 0, 69, 0, 72, 69, 65, 0], [71, 74, 71, 0, 68, 69, 70, 71]];

    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ac = new AC();
        const comp = ac.createDynamicsCompressor();
        master = ac.createGain(); master.gain.value = muted ? 0 : 0.8;
        master.connect(comp); comp.connect(ac.destination);
        musicG = ac.createGain(); musicG.gain.value = 0.5; musicG.connect(master);
        sfxG = ac.createGain(); sfxG.gain.value = 0.9; sfxG.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    function tone(f, t, d, type, v, dest, to) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + d + 0.03);
    }
    function noise(t, d, v, ftype, f, to, dest) {
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const fl = ac.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(f, t);
      if (to) fl.frequency.exponentialRampToValueAtTime(to, t + d);
      const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(fl); fl.connect(g); g.connect(dest || sfxG); s.start(t); s.stop(t + d + 0.03);
    }
    function playStep(st, t) {
      const bar = st >> 3, pos = st & 7;
      if (!(pos & 1)) tone(mtof(BASS[bar][pos >> 1]), t, 0.2, 'triangle', 0.5, musicG);          // pizzicato bas
      if (pos === 3 || pos === 7) for (const n of CH[bar]) tone(mtof(n), t, 0.09, 'square', 0.035, musicG);   // kesik akor
      const m = MEL[bar][pos];
      if (m) { tone(mtof(m), t, 0.15, 'triangle', 0.3, musicG); tone(mtof(m + 12), t, 0.08, 'sine', 0.1, musicG); }  // ksilofon
      if (pos === 2 || pos === 6) tone(900, t, 0.05, 'sine', 0.25, musicG, 600);                 // tahta blok
      if (pos & 1) noise(t, 0.03, 0.05, 'highpass', 6000, null, musicG);                          // zil
    }
    function tick() {
      if (!ac) return;
      while (nextT < ac.currentTime + 0.2) {
        const ed = 60 / Math.min(215, 150 + 14 * (lvl - 1)) / 2;      // seviye arttıkça hızlanır
        playStep(step, nextT + ((step & 1) ? ed * 0.18 : 0));         // hafif salıntı (swing)
        nextT += ed; step = (step + 1) & 31;
      }
    }
    return {
      init,
      music(on, level) {
        if (!ac) return;
        if (timer) { clearInterval(timer); timer = null; }
        if (on) {
          lvl = level || 1;
          musicG.gain.cancelScheduledValues(ac.currentTime); musicG.gain.setValueAtTime(0.5, ac.currentTime);
          nextT = ac.currentTime + 0.1; step = 0; musicOn = true;
          timer = setInterval(tick, 25);
        } else if (musicOn) {
          musicG.gain.setTargetAtTime(0, ac.currentTime, 0.06); musicOn = false;
        }
      },
      setLevel(l) { lvl = l; },
      toggle() {
        muted = !muted;
        try { localStorage.setItem('rmr-muted', muted ? '1' : '0'); } catch (e) {}
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.02);
      },
      get muted() { return muted; },
      suspend(h) { if (ac) { if (h) ac.suspend(); else ac.resume(); } },
      collect(combo, cookie) {
        if (!ac) return;
        const sc = [0, 2, 4, 7, 9, 12, 14, 16], f = mtof(79 + sc[Math.min(combo - 1, 7)]), t = ac.currentTime;
        tone(f, t, 0.09, 'square', 0.12); tone(f * 1.5, t + 0.06, 0.13, 'square', 0.12);
        if (cookie) noise(t, 0.05, 0.2, 'bandpass', 3000);
      },
      hit() {
        if (!ac) return; const t = ac.currentTime;
        tone(320, t, 0.3, 'sawtooth', 0.35, null, 70); tone(110, t, 0.25, 'sine', 0.6, null, 40);
        noise(t, 0.18, 0.5, 'lowpass', 2500, 300);
      },
      shock() {
        if (!ac) return; const t = ac.currentTime;
        tone(150, t, 0.3, 'sawtooth', 0.3, null, 1400);
        noise(t + 0.15, 0.7, 0.6, 'bandpass', 3000, 200);
        tone(140, t + 0.28, 0.6, 'sine', 0.7, null, 35);
      },
      stomp() {
        if (!ac) return; const t = ac.currentTime;
        tone(260, t, 0.14, 'sine', 0.45, null, 720);      // "boing"
        noise(t, 0.04, 0.2, 'bandpass', 1800);
      },
      kiss() {
        if (!ac) return; const t = ac.currentTime;
        tone(900, t, 0.09, 'sine', 0.3, null, 2200);          // yükselen "çıt"
        noise(t + 0.09, 0.06, 0.35, 'bandpass', 3500, 1800);   // dudak "puk"
        tone(1400, t + 0.1, 0.08, 'triangle', 0.2, null, 700);
      },
      levelUp(l) {
        lvl = l; if (!ac) return; const t = ac.currentTime;
        [72, 76, 79, 84].forEach((n, i) => tone(mtof(n), t + i * 0.09, 0.14, 'square', 0.14));
        tone(mtof(88), t + 0.4, 0.35, 'triangle', 0.22); noise(t + 0.4, 0.3, 0.08, 'highpass', 7000);
      },
      gameOver() {
        if (!ac) return; const t = ac.currentTime + 0.35;      // çarpma sesinden hemen sonra "vaa-vaa-vaa-vaaa"
        [[392, 0], [370, 0.3], [349, 0.6], [330, 0.9]].forEach(([f, d], i) => {
          const len = i === 3 ? 0.9 : 0.27;
          tone(f, t + d, len, 'sawtooth', 0.2, null, i === 3 ? f * 0.93 : 0);
          tone(f / 2, t + d, len, 'triangle', 0.25);
        });
      }
    };
  })();
  window.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (state === 'play') setPause(true); Snd.suspend(true); }
    else if (!paused) Snd.suspend(false);
  });

  // ---------- Ekrana sığdırma ----------
  let scale = 1, offX = 0, offY = 0;
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    const cssW = W * scale, cssH = H * scale;
    offX = (vw - cssW) / 2; offY = (vh - cssH) / 2;
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
    cv.style.left = offX + 'px'; cv.style.top = offY + 'px';
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Durum ----------
  let SCROLL = 360;   // dünya hızı; oyun ilerledikçe artar
  const BTN = { x: W / 2 - 110, y: 255, w: 220, h: 70 };    // Başla
  const HELP_BTN = { x: W / 2 - 110, y: 345, w: 220, h: 54 };   // Nasıl oynanır
  let showHelp = false;
  const BTN2 = { x: W / 2 - 110, y: 380, w: 220, h: 70 };   // Tekrar
  const inside = (b, px, py) => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  let paused = false, overT = 0, newRecord = false, best = 0;
  try { best = parseInt(localStorage.getItem('rmr-best'), 10) || 0; } catch (e) {}
  const jumpPtrs = new Set();
  function setPause(on) {
    if (state !== 'play' || paused === on) return;
    paused = on; keyDown = false; jumpPtrs.clear();
    Snd.suspend(on);
  }
  function endGame() {
    state = 'over'; overT = 0.6; paused = false; keyDown = false; jumpPtrs.clear();
    newRecord = score > best;
    if (newRecord) { best = score; try { localStorage.setItem('rmr-best', String(best)); } catch (e) {} }
    Snd.music(false); Snd.gameOver();
  }
  let state = 'menu';            // menu | play | over
  let t = 0;                     // oyun saati
  let worldX = 0;                // kayan dünya
  let score, lives, hold, mouse, cats, cheeses, nextSpawn, invuln, jumpBuffer, hitFlash;
  let kids, slippers, lady, ladyTimer, popups;
  let hitStop = 0, shake = 0, flash = 0, parts = [], combo = 0, comboT = 0, comboPop = 0;
  let bag = [], lastType = '';
  let desks = [], deskTimer = 15, deskLong = true;
  let playT = 0, level = 1, bannerT = 0, power = 0, wave = null;
  let keyDown = false;

  function reset() {
    score = 0; lives = 3; invuln = 0; jumpBuffer = 0; hitFlash = 0;
    mouse = { x: 150, y: GROUND, vy: 0, onGround: true, jumps: 0, tilt: 0, sq: 1 };
    desks = []; deskTimer = 15; deskLong = true;
    SCROLL = 360; playT = 0; level = 1; bannerT = 2; power = 0; wave = null;
    hitStop = 0; shake = 0; flash = 0; parts = []; combo = 0; comboT = 0; comboPop = 0;
    cats = []; cheeses = []; nextSpawn = 1.6;
    kids = []; slippers = []; lady = null; ladyTimer = 30; popups = []; bag = []; lastType = '';
  }
  reset();

  // ---------- Girdi ----------
  function pressJump() { jumpBuffer = 0.12; keyDown = true; }
  window.addEventListener('keydown', e => {
    Snd.init();
    if (e.code === 'KeyM') { Snd.toggle(); return; }
    if (e.code === 'KeyP') { if (state === 'play') setPause(!paused); return; }
    if (state === 'menu' && (showHelp || e.code === 'KeyH')) {      // yardım penceresi
      if (e.code === 'KeyH') showHelp = !showHelp;
      else if (['Escape', 'Space', 'Enter', 'ArrowUp'].includes(e.code)) { e.preventDefault(); showHelp = false; }
      return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) {
        if (state === 'menu' || (state === 'over' && overT <= 0)) startGame();
        else if (state === 'play') { if (paused) setPause(false); else pressJump(); }
      }
      keyDown = !paused;
    } else if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && state === 'play') {
      useShock();
    } else if (e.code === 'Enter' && (state === 'menu' || (state === 'over' && overT <= 0))) {
      startGame();
    } else if (e.code === 'KeyR' && state === 'over' && overT <= 0) {
      startGame();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') keyDown = false;
  });
  window.addEventListener('blur', () => { keyDown = false; if (state === 'play') setPause(true); });
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('touchend', () => Snd.init());   // iOS sesi ancak dokunma bitince açar
  // Dokunmatik ve fare: dokun = zıpla, basılı tut = daha yükseğe; düğmeler ayrı
  const SHOCK_BTN = { x: W - 120, y: 480 }, PAUSE_BTN = { x: 40, y: H - 36 };
  window.addEventListener('pointerdown', e => {
    Snd.init();
    const px = (e.clientX - offX) / scale, py = (e.clientY - offY) / scale;
    if (Math.hypot(px - (W - 40), py - (H - 36)) < 28) { Snd.toggle(); return; }   // ses simgesi
    if (state === 'menu') {
      if (showHelp) { showHelp = false; return; }
      if (inside(BTN, px, py)) startGame(); else if (inside(HELP_BTN, px, py)) showHelp = true;
      return;
    }
    if (state === 'over') { if (overT <= 0 && inside(BTN2, px, py)) startGame(); return; }
    if (paused) { setPause(false); return; }
    if (Math.hypot(px - PAUSE_BTN.x, py - PAUSE_BTN.y) < 30) { setPause(true); return; }
    if (Math.hypot(px - SHOCK_BTN.x, py - SHOCK_BTN.y) < 46) { useShock(); return; }
    jumpPtrs.add(e.pointerId); pressJump();
  });
  const releasePtr = e => { jumpPtrs.delete(e.pointerId); if (!jumpPtrs.size) keyDown = false; };
  window.addEventListener('pointerup', releasePtr);
  window.addEventListener('pointercancel', releasePtr);
  function startGame() { reset(); state = 'play'; paused = false; showHelp = false; Snd.suspend(false); Snd.music(true, 1); }

  // ---------- Oyun mantığı ----------
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // Çeşitleri eşit dağıtan torba: kedi, öğrenci, peynir, kurabiye; art arda aynısı gelmez
  function nextType() {
    if (!bag.length) {
      do {
        bag = ['cat', 'kid', 'cheese', 'cookie'];
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]];
        }
      } while (bag[0] === lastType);
    }
    lastType = bag.shift();
    return lastType;
  }

  function spawn() {
    const type = nextType();
    if (type === 'cat') {
      cats.push({ x: W + 60, w: 84, h: 78, phase: Math.random() * 6 });
      // zorlaştıkça arkasından ikinci bir kedi gelebilir
      if (diff() > 0.45 && Math.random() < (diff() - 0.35) * 0.9)
        cats.push({ x: W + 60 + rnd(250, 330), w: 84, h: 78, phase: Math.random() * 6 });
      nextSpawn = hz(rnd(1.3, 2.3));
    } else if (type === 'kid') {
      // fareden korkan öğrenci (terlik atar)
      const shirts = ['#e5534b', '#4b8fe5', '#52b788', '#f2a541'];
      const hairs = ['#3b2a1f', '#d9a441', '#7a3b1e'];
      kids.push({ x: W + 60, w: 52, h: 100, phase: Math.random() * 6, age: 0, thrown: false, armT: 0,
        girl: Math.random() < 0.5, shirt: shirts[Math.floor(Math.random() * 4)], hair: hairs[Math.floor(Math.random() * 3)] });
      nextSpawn = hz(rnd(1.8, 2.6));
    } else {
      // peynir ya da kurabiye deseni: yerde sıra ya da havada yay
      const cookie = type === 'cookie';
      const n = cookie ? 3 : 3 + Math.floor(Math.random() * 3);
      const air = Math.random() < 0.55;
      const lift = air ? rnd(110, 150) : 0;
      for (let i = 0; i < n; i++) {
        const k = n > 1 ? i / (n - 1) : 0;
        const arc = air ? Math.sin(k * Math.PI) * 30 : 0;
        cheeses.push({ x: W + 40 + i * 52, y: GROUND - 24 - lift - arc, r: 17, bob: Math.random() * 6,
          kind: cookie ? 'cookie' : 'cheese' });
      }
      nextSpawn = rnd(0.9, 1.5) * (1 - 0.3 * diff());
    }
  }

  // ---------- Zorlaşma ----------
  // 0-20 sn: rahat (0), 20-90 sn: yavaş yavaş artar, 90. sn ve sonrası: en zor (1)
  function diff() { return Math.max(0, Math.min(1, (playT - 20) / 70)); }
  // oyun ilerledikçe hızlanma: 20. sn'den 90. sn'ye kadar %45, sonra yavaşça %60'a
  function speedMul() { return 1 + 0.45 * diff() + 0.15 * Math.min(1, Math.max(0, (playT - 90) / 120)); }
  function hz(g) { return Math.max(0.8, g * (1.25 - 0.8 * diff())); }   // tehlike aralığı kısalır

  const DESK_H = 88;
  function deskTopAt(x) {
    for (const d of desks) if (x >= d.x - 4 && x <= d.x + d.w + 4) return GROUND - DESK_H;
    return null;
  }

  function throwSlipper(k) {
    k.armT = 0.3;
    const sx = k.x - 10, sy = GROUND - 84;
    const tt = (sx - mouse.x) / (SCROLL + 260);
    let ty = Math.random() < 0.5 ? GROUND - 20 : GROUND - 55;
    // fare o sırada masanın üstünde olacaksa terlik masa hizasında gelir
    if (desks.some(d => { const dx = d.x - SCROLL * tt; return mouse.x >= dx && mouse.x <= dx + d.w; }))
      ty = GROUND - DESK_H - (Math.random() < 0.5 ? 18 : 30);
    slippers.push({ x: sx, y: sy, vy: (ty - sy) / tt, ang: 0 });
  }

  // ---------- Özel hamle: şok dalgası ----------
  function useShock() {
    if (state !== 'play' || paused || power < 100 || wave) return;
    power = 0; wave = { r: 0 };
    invuln = Math.max(invuln, 0.7);
    shake = 0.22; flash = 0.12; Snd.shock();
  }

  // ---------- His katmanı: parçacıklar, sarsıntı, kombo ----------
  function burst(x, y, n, cols, speed, life, g) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * rnd(0.4, 1);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3, g: g, life: rnd(life * 0.6, life),
        max: life, r: rnd(2.5, 5.5), col: cols[Math.floor(Math.random() * cols.length)] });
    }
  }
  function fx(dt) {
    if (shake > 0) shake -= dt;
    if (flash > 0) flash -= dt;
    if (hitFlash > 0) hitFlash -= dt;
    if (comboPop > 0) comboPop -= dt;
    for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter(p => p.life > 0);
  }
  function drawParticles() {
    for (const p of parts) {
      const k = Math.max(0, p.life / p.max);
      ctx.save(); ctx.globalAlpha = Math.min(1, k * 2);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + k * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = p.col; ctx.fill(); ctx.lineWidth = 1.8; ctx.strokeStyle = INK; ctx.stroke();
      ctx.restore();
    }
  }
  // arka planda yavaş kayan canlı katman: flama, toz zerreleri, kâğıt uçak
  function drawSlowLayer() {
    ctx.save();
    // flama (en yavaş)
    const gap = 160, off = (t * 14) % gap, cols = ['#ee4b5e', '#ffd23f', '#4b8fe5', '#52b788'];
    outline(3);
    ctx.beginPath();
    for (let x = -gap - off; x < W + gap; x += gap) {
      ctx.moveTo(x, 6); ctx.quadraticCurveTo(x + gap / 2, 44, x + gap, 6);
    }
    ctx.stroke();
    let idx = 0;
    for (let x = -gap - off; x < W + gap; x += gap) {
      for (let j = 1; j <= 3; j++) {
        const u = j / 4, px = x + gap * u, py = 6 + 4 * 4 * u * (1 - u) * 9 * 0.5 + 0;
        const yy = 6 + 38 * 2 * u * (1 - u);
        ctx.beginPath(); ctx.moveTo(px - 9, yy); ctx.lineTo(px + 9, yy); ctx.lineTo(px, yy + 20); ctx.closePath();
        ctx.fillStyle = cols[(idx++) % 4]; ctx.fill(); ctx.stroke();
      }
    }
    // toz zerreleri
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 26; i++) {
      const x = ((i * 97 + t * (10 + (i % 5) * 5)) % (W + 40)) - 20;
      const y = 70 + ((i * 53) % 330) + Math.sin(t * 0.9 + i) * 10;
      ctx.beginPath(); ctx.arc(W - x, y, 1.5 + (i % 3), 0, Math.PI * 2); ctx.fill();
    }
    // kâğıt uçak
    const px = ((t * 38) % 1700) - 200, py = 120 + Math.sin(t * 1.3) * 25;
    ctx.translate(W - px, py); ctx.scale(-1, 1); ctx.rotate(Math.sin(t * 1.3) * 0.12);
    outline(2.5); ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-34, -10); ctx.lineTo(-22, 2); ctx.lineTo(-34, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function stomp(x, y) {
    const m = mouse;
    m.vy = -560; m.jumps = 1; m.onGround = false; m.sq = 0.7;     // küçük sekme; havada bir zıplama hakkı kalır
    burst(x, y, 10, ['#fff', '#ffd23f'], 220, 0.5, 450);
    Snd.stomp();
  }

  function hurt() {
    lives--; invuln = 1.6; hitFlash = 0.25;
    hitStop = 0.09; shake = 0.32; flash = 0.2; combo = 0; comboT = 0;
    burst(mouse.x + 10, mouse.y - 24, 16, ['#fff', '#ffd23f', '#ee4b5e'], 330, 0.55, 500);
    Snd.hit();
    if (lives <= 0) { lives = 0; endGame(); }
  }

  function update(dt) {
    t += dt;
    playT += dt;
    SCROLL = 360 * speedMul();
    worldX += SCROLL * dt;
    if (bannerT > 0) bannerT -= dt;
    const lv = Math.floor(playT / 30) + 1;
    if (lv > level) { level = lv; bannerT = 2; Snd.levelUp(level); }
    if (invuln > 0) invuln -= dt;
    if (jumpBuffer > 0) jumpBuffer -= dt;

    // fare fiziği
    const m = mouse;
    if (jumpBuffer > 0 && (m.onGround || m.jumps < 2)) {
      if (m.onGround) { m.vy = -780; m.jumps = 1; m.sq = 0.75; }
      else {                       // havada ikinci zıplama
        m.vy = -740; m.jumps = 2; m.sq = 0.8;
        popups.push({ kind: 'ring', x: m.x, y: m.y + 4, vy: 0, life: 0.35 });
      }
      m.onGround = false; jumpBuffer = 0;
    }
    const deskTop = deskTopAt(m.x);
    if (m.onGround && m.y < GROUND && deskTop === null) { m.onGround = false; m.vy = 0; m.jumps = 1; }   // masa bitti, aşağı düş
    if (!m.onGround) {
      const g = (m.vy < 0 && keyDown) ? 1800 : 2800;   // basılı tutunca daha yükseğe
      m.vy += g * dt;
      const prev = m.y;
      m.y += m.vy * dt;
      let floor = GROUND;
      if (deskTop !== null && m.vy >= 0 && prev <= deskTop + 1) floor = deskTop;   // masanın üstüne konma
      if (m.y >= floor) {
        if (m.vy > 350) { m.sq = 0.68; burst(m.x, floor - 2, 7, ['#f5e6c8', '#d9b98a'], 120, 0.4, 200); }
        m.y = floor; m.vy = 0; m.onGround = true; m.jumps = 0;
      }
    }

    // yumuşak eğilme ve ezilip uzama
    {
      const target = m.onGround ? 0.07 : Math.max(-0.35, Math.min(0.45, m.vy / 1800));
      m.tilt += (target - m.tilt) * Math.min(1, dt * 12);
      const sqT = m.onGround ? 1 : 1 + Math.min(0.14, Math.abs(m.vy) / 6000);
      m.sq += (sqT - m.sq) * Math.min(1, dt * 14);
    }

    // masalar: nadir gelir, kısa sürer; üstüne çıkılıp koşulabilir
    deskTimer -= dt;
    if (deskTimer <= 0) {
      deskLong = !deskLong;                      // sırayla kısa (≈1,2 sn) ve uzun (≈2,5 sn) masa
      const dur = (deskLong ? 2.5 : 1.2) * speedMul();      // süre hızlanmayla orantılı uzar
      const dw = Math.round(dur * SCROLL), n = Math.max(3, Math.round(dw / 110));
      desks.push({ x: W + 40, w: dw });
      for (let i = 0; i < n; i++) cheeses.push({ x: W + 120 + i * (dw - 160) / (n - 1), y: GROUND - DESK_H - 24, r: 17, bob: i, kind: 'cheese' });
      deskTimer = rnd(30, 45); nextSpawn = Math.max(nextSpawn, 1.0);
    }
    for (const d of desks) d.x -= SCROLL * dt;
    desks = desks.filter(d => d.x + d.w > -60);

    // oluşturma
    nextSpawn -= dt;
    if (nextSpawn <= 0) spawn();

    // hareket
    for (const c of cats) c.x -= SCROLL * dt;
    for (const c of cheeses) c.x -= SCROLL * dt;
    cats = cats.filter(c => c.x > -150);

    // öğrenciler ve terlikler
    for (const k of kids) {
      k.age += dt;
      if (k.flee) k.x += (700 - SCROLL) * dt;          // "İmdat!" deyip sağa kaçar
      else k.x -= (SCROLL + 50) * dt;
      if (k.armT > 0) k.armT -= dt;
      if (!k.flee && !k.thrown && k.x < W - 70) { k.thrown = true; k.t1 = k.age; throwSlipper(k); }
    }
    kids = kids.filter(k => k.x > -100 && k.x < W + 200);
    for (const c of cats) if (c.sqT > 0) c.sqT -= dt;
    for (const s of slippers) {
      s.x -= (SCROLL + 260) * dt; s.y += s.vy * dt; s.ang += 14 * dt;
      if (s.y > GROUND - 14) { s.y = GROUND - 14; s.vy = 0; }
    }
    slippers = slippers.filter(s => s.x > -60);

    // bayan fare
    ladyTimer -= dt;
    if (lady) { lady.x -= SCROLL * dt; lady.age += dt; if (lady.x < -80) lady = null; }
    else if (ladyTimer <= 0 && lives < 3) {
      lady = { x: W + 60, age: 0 }; ladyTimer = 40; nextSpawn = Math.max(nextSpawn, 2);
    }
    for (const p of popups) { p.life -= dt; p.y += p.vy * dt; }
    popups = popups.filter(p => p.life > 0);

    // şok dalgası tehlikeleri süpürür
    if (wave) {
      wave.r += 1500 * dt;
      const hit = (x, y) => Math.abs(x - mouse.x) <= wave.r;
      for (const c of cats) if (hit(c.x + c.w / 2)) burst(c.x + c.w / 2, GROUND - 40, 14, ['#fff', '#6f8fb8', '#ffd23f'], 300, 0.6, 500);
      for (const k of kids) if (hit(k.x + 26)) burst(k.x + 26, GROUND - 50, 14, ['#fff', k.shirt, '#ffd23f'], 300, 0.6, 500);
      for (const s of slippers) if (hit(s.x)) burst(s.x, s.y, 8, ['#ff8fb1', '#fff'], 220, 0.5, 400);
      cats = cats.filter(c => !hit(c.x + c.w / 2));
      kids = kids.filter(k => !hit(k.x + 26));
      slippers = slippers.filter(s => !hit(s.x));
      if (wave.r > 1300) wave = null;
    }

    // fare kutusu
    const mb = { l: m.x - 17, r: m.x + 17, t: m.y - 36, b: m.y };

    // peynir toplama
    cheeses = cheeses.filter(c => {
      if (c.x < -50) return false;
      if (!c.missed && c.x < mouse.x - 40) { c.missed = true; combo = 0; }   // ödül kaçtı: kombo biter
      const cx = Math.max(mb.l, Math.min(c.x, mb.r));
      const cy = Math.max(mb.t, Math.min(c.y, mb.b));
      if ((cx - c.x) ** 2 + (cy - c.y) ** 2 < (c.r + 4) ** 2) {
        const pts = c.kind === 'cookie' ? 30 : 10;
        combo++; comboPop = 0.25; Snd.collect(combo, c.kind === 'cookie');
        power = Math.min(100, power + 4.8);   // parça başına %4,8 (kombo etkilemez)
        const gain = pts * combo;          // kombo x2 iken peynir 20, x3 iken 30...
        score += gain;
        burst(c.x, c.y, 11, c.kind === 'cookie' ? ['#e0a45f', '#5a3320', '#fff6d6'] : ['#ffd23f', '#fff6d6', '#e6a817'], 230, 0.6, 450);
        popups.push({ kind: 'text', text: '+' + gain, color: '#fff6d6', x: c.x, y: c.y - 20, vy: -70, life: 1.0 });
        return false;
      }
      return true;
    });

    // kedi çarpışması
    if (invuln <= 0) {
      for (const c of cats) {
        const l = c.x + 10, r = c.x + c.w - 8, tp = GROUND - c.h + 12;
        if (c.safe) continue;
        if (mb.r > l && mb.l < r && mb.b > tp && mb.t < GROUND) {
          if (m.vy > 0 && mb.b <= tp + 26) { c.safe = true; c.sqT = 0.25; stomp(c.x + c.w / 2, tp); }   // tepesine indi: can gitmez
          else { hurt(); c.hit = true; break; }
        }
      }
      cats = cats.filter(c => !c.hit);
    }
    if (invuln <= 0 && !(m.onGround && m.y < GROUND - 10)) {   // masadaki fareye öğrencinin kendisi değemez
      for (const k of kids) {
        if (k.flee) continue;
        const l = k.x + 8, r = k.x + k.w - 6, tp = GROUND - k.h;
        if (mb.r > l && mb.l < r && mb.b > tp && mb.t < GROUND) {
          if (m.vy > 0 && mb.b <= tp + 26) { k.flee = true; k.age = 0; stomp(k.x + k.w / 2, tp); }   // öğrenci imdat deyip kaçar
          else { hurt(); k.hit = true; break; }
        }
      }
      kids = kids.filter(k => !k.hit);
    }
    if (invuln <= 0) {
      for (const s of slippers) {
        const cx = Math.max(mb.l, Math.min(s.x, mb.r));
        const cy = Math.max(mb.t, Math.min(s.y, mb.b));
        if ((cx - s.x) ** 2 + (cy - s.y) ** 2 < 13 * 13) { hurt(); s.hit = true; break; }
      }
      slippers = slippers.filter(s => !s.hit);
    }
    // öpücük: canlar dolar
    if (lady && mb.r > lady.x - 22 && mb.l < lady.x + 22 && mb.b > GROUND - 70) {
      lives = 3; lady = null; Snd.kiss();
      popups.push({ kind: 'text', text: 'Öpücük! Canlar doldu', color: '#ff8fb1', x: m.x + 90, y: m.y - 90, vy: -40, life: 1.6 });
      for (let i = 0; i < 7; i++)
        popups.push({ kind: 'heart', x: m.x + rnd(-10, 50), y: m.y - 50 + rnd(-10, 10), vy: -rnd(60, 130), life: rnd(0.9, 1.5) });
    }
  }

  function ell(x, y, rx, ry, fill, rot) {

  const BOARDS = ['1 + 2 = 3', 'A B C Ç D', '2 + 2 = 4', 'E F G Ğ H'];
  function drawBackground() {
    // duvar

      ctx.font = '26px ' + FONT; ctx.fillStyle = '#f5f5f0'; ctx.textAlign = 'left';
      ctx.fillText(BOARDS[(((i + Math.floor(p / span)) % 4) + 4) % 4], bx + 72, 148);
      ctx.fillStyle = '#e9e1d0'; ctx.fillRect(bx + 60, 172, 60, 6);
      outline(4);
      // pencere
      ctx.fillStyle = '#9fd8f2'; ctx.fillRect(bx + 310, 55, 90, 120); ctx.strokeRect(bx + 310, 55, 90, 120);
      ctx.beginPath(); ctx.moveTo(bx + 355, 55); ctx.lineTo(bx + 355, 175); ctx.moveTo(bx + 310, 115); ctx.lineTo(bx + 400, 115); ctx.stroke();
    }

    // sıralar (arka plan, biraz daha hızlı)
    const q = worldX * 0.6, span2 = 300;
    for (let i = -1; i < 5; i++) {
      const dx = i * span2 - (q % span2) + 40;
      outline(3.5);

      ctx.fillRect(dx + 102, 354, 10, 56); ctx.strokeRect(dx + 102, 354, 10, 56);
      // sandalye
      ctx.fillStyle = '#e07a5f'; ctx.fillRect(dx + 20, 372, 36, 8); ctx.strokeRect(dx + 20, 372, 36, 8);
    }

    // zemin
    ctx.fillStyle = '#c98b4b'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = INK; ctx.fillRect(0, GROUND - 2, W, 5);
    ctx.fillStyle = '#b5773a';
    const plank = 120, f = worldX % plank;
    outline(3);
    for (let x = -f; x < W; x += plank) {
      ctx.beginPath(); ctx.moveTo(x, GROUND + 3); ctx.lineTo(x - 30, H); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0, GROUND + 50); ctx.lineTo(W, GROUND + 50); ctx.stroke();
  }

  function drawCheese(x, y, r, bob) {
    const by = y + Math.sin(t * 4 + bob) * 3;

    ctx.lineTo(r + 6, -r * 0.8);
    ctx.lineTo(r + 6, r * 0.7);
    ctx.closePath();
    ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.stroke();
    // üst yüzey
    ctx.beginPath();
    ctx.moveTo(-r - 4, -r * 0.1);
    ctx.lineTo(-r + 6, -r * 0.7);
    ctx.lineTo(r + 14, -r * 1.3);
    ctx.lineTo(r + 6, -r * 0.8);

  function drawMouse() {

  function mouseFigure(FUR, DARK, BELLY, run, air) {

    outline(3.5);

    // arka bacak
    const lf = air ? 6 : run * 9;

    // gövde
    ell(0, -22, 20, 16, FUR, -0.1);
    ell(3, -17, 12, 9, BELLY);
    // ön bacak
    ell(12 + lf * 0.5, -5, 9, 5, DARK);

    ctx.beginPath(); ctx.ellipse(14, -36, 15, 13, 0, 0, Math.PI * 2);

  function drawSlipper(sc) {
    // üstten görünen ev terliği: ayak biçiminde taban + ayak üstü kayışı
    ctx.save(); ctx.scale(sc || 1, sc || 1);
    outline(3);
    const sole = (dy) => {
      ctx.beginPath();
      ctx.moveTo(-22, dy);
      ctx.bezierCurveTo(-22, dy - 8, -14, dy - 8, -6, dy - 6.5);
      ctx.bezierCurveTo(2, dy - 5, 4, dy - 11, 14, dy - 11);
      ctx.bezierCurveTo(24, dy - 11, 27, dy - 5, 27, dy);
      ctx.bezierCurveTo(27, dy + 5, 24, dy + 11, 14, dy + 11);
      ctx.bezierCurveTo(4, dy + 11, 2, dy + 5, -6, dy + 6.5);
      ctx.bezierCurveTo(-14, dy + 8, -22, dy + 8, -22, dy);
      ctx.closePath();
    };
    sole(3); ctx.fillStyle = '#c2305f'; ctx.fill(); ctx.stroke();      // taban kalınlığı
    sole(0); ctx.fillStyle = '#ff7fa8'; ctx.fill(); ctx.stroke();      // üst taban
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-13, -1, 5, 3, 0, 0, Math.PI * 2); ctx.fill();   // topuk parlaması
    // ayak üstü kayışı: tabanın içine kırpılmış, kenarları kavisli geniş bant
    ctx.save();
    sole(0); ctx.clip();
    ctx.beginPath(); ctx.moveTo(5, -14); ctx.quadraticCurveTo(11, 0, 5, 14); ctx.lineTo(14, 14); ctx.quadraticCurveTo(20, 0, 14, -14); ctx.closePath();
    ctx.fillStyle = '#4b8fe5'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(8, -9, 4, 3);
    ctx.restore();
    sole(0); ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  function drawWave() {
    if (!wave) return;
    const cx = mouse.x, cy = mouse.y - 20, a = Math.max(0, 1 - wave.r / 1300);

    for (const [off, lw, col] of [[0, 16, '#fff6d6'], [45, 10, '#ffd23f'], [95, 6, '#ee4b5e']]) {

      ctx.lineWidth = lw + 7; ctx.strokeStyle = INK; ctx.stroke();

    ctx.restore();
    ctx.save(); ctx.globalAlpha = Math.min(1, a * 2.5);

    ctx.restore();

  function drawPower() {
    const x = W / 2 - 180, y = 488, w = 360, h = 28, full = power >= 100;
    const pulse = full ? 1 + Math.sin(t * 10) * 0.04 : 1;
    ctx.save(); ctx.translate(W / 2, y + h / 2); ctx.scale(pulse, pulse); ctx.translate(-W / 2, -(y + h / 2));
    outline(4);
    roundRect(x, y, w, h, 12); ctx.fillStyle = '#fff6d6'; ctx.fill();
    ctx.save(); roundRect(x, y, w, h, 12); ctx.clip();
    ctx.fillStyle = full ? '#ffd23f' : '#4bb3e5'; ctx.fillRect(x, y, w * power / 100, h);
    ctx.restore();
    roundRect(x, y, w, h, 12); ctx.stroke();
    ctx.font = 'bold 18px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = INK;
    ctx.strokeText('ŞOK DALGASI', W / 2, y - 12); ctx.fillStyle = full ? '#ffd23f' : '#fff'; ctx.fillText('ŞOK DALGASI', W / 2, y - 12);
    if (full) { ctx.strokeText('SHIFT', W / 2, y + h / 2 + 1); ctx.fillStyle = '#fff'; ctx.fillText('SHIFT', W / 2, y + h / 2 + 1); }
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  }

  function drawSoundIcon() {
    const x = W - 40, y = H - 36, off = Snd.muted;
    ctx.save(); outline(3.5);
    ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fillStyle = '#fff6d6'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 10, y - 4); ctx.lineTo(x - 5, y - 4); ctx.lineTo(x + 2, y - 10); ctx.lineTo(x + 2, y + 10); ctx.lineTo(x - 5, y + 4); ctx.lineTo(x - 10, y + 4); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    ctx.lineWidth = 2.5;
    if (off) { ctx.strokeStyle = '#ee4b5e'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x + 5, y - 6); ctx.lineTo(x + 14, y + 6); ctx.moveTo(x + 14, y - 6); ctx.lineTo(x + 5, y + 6); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(x + 3, y, 7, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 3, y, 12, -0.9, 0.9); ctx.stroke(); }
    ctx.restore();
  }

  function drawHeart(x, y, s, on) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    outline(2.5 / s);
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-18, -4, -10, -18, 0, -8);
    ctx.bezierCurveTo(10, -18, 18, -4, 0, 8);
    ctx.fillStyle = on ? '#ee4b5e' : '#cdbfae'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawHUD() {
    // puan levhası
    outline(4);
    ctx.fillStyle = '#fff6d6';
    roundRect(16, 14, 210, 54, 14); ctx.fill(); ctx.stroke();
    drawCheese(46, 42, 14, 0);
    ctx.fillStyle = INK; ctx.font = 'bold 30px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(String(score), 86, 43);
    // canlar
    roundRect(W - 166, 14, 150, 54, 14); ctx.fillStyle = '#fff6d6'; ctx.fill(); ctx.stroke();
    for (let i = 0; i < 3; i++) drawHeart(W - 130 + i * 46, 42, 1.25, i < lives);
    if (combo >= 2 && state === 'play') {
      const pop = 1 + Math.max(0, comboPop) * 2.4;
      ctx.save(); ctx.translate(120, 100); ctx.scale(pop, pop);
      titleText('KOMBO x' + combo, 0, 0, 30, combo >= 5 ? '#ff8fb1' : '#ffd23f');
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic';
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function titleText(str, x, y, size, fill) {
    ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = size * 0.2; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y); ctx.fillStyle = fill; ctx.fillText(str, x, y);
    ctx.textBaseline = 'alphabetic';
  }

  function drawScene() {
    ctx.save();
    if (shake > 0 && !paused) {
      const amp = 16 * Math.min(1, shake / 0.32);
      ctx.translate(W / 2 + (Math.random() * 2 - 1) * amp, H / 2 + (Math.random() * 2 - 1) * amp);
      ctx.scale(1.04, 1.04); ctx.translate(-W / 2, -H / 2);
    }
    drawBackground();
    drawSlowLayer();
    for (const d of desks) drawDesk(d);
    if (lady) drawLady(lady);
    for (const c of cheeses) (c.kind === 'cookie' ? drawCookie : drawCheese)(c.x, c.y, c.r, c.bob);
    for (const c of cats) drawCat(c);
    for (const k of kids) drawKid(k);
    for (const s of slippers) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang); drawSlipper(1); ctx.restore(); }
    drawMouse();
    drawWave();
    drawParticles();
    drawPopups();
    if (state !== 'menu') drawHUD();
    if (state === 'play') drawPower();
    if (state === 'play' && !paused && bannerT > 0) {
      ctx.save(); ctx.globalAlpha = Math.min(1, bannerT / 0.5);
      const pop = bannerT > 1.7 ? 1 + (bannerT - 1.7) * 3 : 1;
      ctx.translate(W / 2, 160); ctx.scale(pop, pop);
      titleText('Seviye ' + level, 0, 0, 68, '#fff6d6');
      ctx.restore();
    }
    if (hitFlash > 0) {
      ctx.fillStyle = 'rgba(238,75,94,' + (hitFlash * 1.4) + ')'; ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.75, flash / 0.2 * 0.75) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  function waveTitle(str, cx, y, size) {
    ctx.save();
    ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const chars = [...str], w = chars.map(c => ctx.measureText(c).width), total = w.reduce((a, b) => a + b, 0);
    ctx.translate(cx, y); ctx.rotate(-0.035);
    let x = -total / 2;
    chars.forEach((ch, i) => {
      const dy = Math.sin(performance.now() / 320 + i * 0.55) * 5;
      ctx.lineWidth = size * 0.2; ctx.strokeStyle = INK;
      ctx.strokeText(ch, x, dy + 9); ctx.fillStyle = '#b8323f'; ctx.fillText(ch, x, dy + 9);   // derinlik
      ctx.strokeText(ch, x, dy); ctx.fillStyle = '#ffd23f'; ctx.fillText(ch, x, dy);           // ön yüz
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillText(ch, x - 1.5, dy - 2.5);
      ctx.fillStyle = '#ffd23f'; ctx.fillText(ch, x, dy + 1);
      x += w[i];
    });
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  }

  function strokedText(str, x, y, size, fill, lw) {
    ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = lw || 5; ctx.strokeStyle = INK; ctx.strokeText(str, x, y); ctx.fillStyle = fill || '#fff6d6'; ctx.fillText(str, x, y);
  }

  function bigButton(b, label, color, fs) {
    const pulse = 1 + Math.sin(performance.now() / 250) * 0.03;
    ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(pulse, pulse);
    outline(5);
    roundRect(-b.w / 2, -b.h / 2 + 6, b.w, b.h, 22); ctx.fillStyle = 'rgba(50,15,10,0.6)'; ctx.fill(); ctx.stroke();   // alt gölge
    roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 22); ctx.fillStyle = color; ctx.fill(); ctx.stroke();
    ctx.font = 'bold ' + (fs || 38) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.strokeText(label, 0, 3); ctx.fillStyle = '#fff'; ctx.fillText(label, 0, 3);
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  }

  function drawMenu() {
    ctx.fillStyle = 'rgba(30,18,10,0.4)'; ctx.fillRect(0, 0, W, H);
    waveTitle('Run Mouse Run', W / 2, 100, 88);
    ctx.save(); ctx.translate(62, 108); ctx.scale(1.2, 1.2); drawCheese(0, 0, 17, 0); ctx.restore();
    ctx.save(); ctx.translate(W - 62, 108); ctx.scale(-1.2, 1.2); drawCheese(0, 0, 17, 2); ctx.restore();
    strokedText('Minik fare, kedilerden ve terlik atan çocuklardan kaçıp peynir ve kurabiye topluyor!', W / 2, 190, 21);
    bigButton(BTN, 'Başla', '#ee4b5e');
    bigButton(HELP_BTN, 'Nasıl oynanır', '#4b8fe5', 26);
    strokedText('Boşluk ya da Enter ile de başlar', W / 2, 428, 18, '#fff6d6', 4);
    if (best > 0) strokedText('En iyi puan: ' + best, W / 2, 462, 22, '#ffd23f', 4);
    if (window.innerHeight > window.innerWidth) strokedText('Daha rahat oynamak için telefonu yan çevir', W / 2, 500, 20, '#fff6d6', 4);
    if (showHelp) drawHelp();
  }

  function drawHelp() {
    ctx.fillStyle = 'rgba(30,18,10,0.55)'; ctx.fillRect(0, 0, W, H);
    outline(5); ctx.fillStyle = 'rgba(255,246,214,0.97)'; roundRect(110, 40, W - 220, 420, 22); ctx.fill(); ctx.stroke();
    titleText('Nasıl oynanır', W / 2, 90, 46, '#ee4b5e');
    ctx.font = '21px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = INK;
    const touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
    const common = ['Düşmanın tepesine inersen can gitmez',
      'Peynir ve kurabiye topla; art arda toplarsan kombo puanı katlar',
      'Bayan fare düşman değil: dokununca öpücük verir ve canını doldurur'];
    const lines = touch ? [
      'Ekrana dokun: zıpla',
      'Havada bir kez daha dokun: ikinci zıplama',
      'Sağ alttaki şimşek düğmesi: şok dalgası (çubuk dolunca)',
      'Sol alttaki düğme: duraklat    Sağ alttaki hoparlör: ses',
      ...common,
      'Telefonu yan çevirirsen ekran büyür'
    ] : [
      'Boşluk / ↑: zıpla',
      'Havada bir kez daha zıplayabilirsin',
      'Shift: şok dalgası (çubuk dolunca)',
      'P: duraklat     M: ses',
      ...common,
      'Telefonda: dokun = zıpla, şimşek düğmesi = şok dalgası'
    ];
    lines.forEach((l, i) => {
      const lady = l.startsWith('Bayan fare');
      ctx.font = 'bold 21px ' + FONT; ctx.fillStyle = lady ? '#d6336c' : INK;   // bayan fare satırı ayrı renkte
      ctx.fillText(l, W / 2, 142 + i * 33);
    });
    bigButton({ x: W / 2 - 90, y: 394, w: 180, h: 54 }, 'Tamam', '#52b788', 28);
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(30,18,10,0.6)'; ctx.fillRect(0, 0, W, H);
    titleText('Oyun bitti', W / 2, 120, 82, '#ee4b5e');
    titleText('Puan: ' + score, W / 2, 215, 58, '#ffd23f');
    strokedText('En iyi puan: ' + best, W / 2, 285, 34, '#fff6d6', 6);
    if (newRecord) {
      const k = 1 + Math.sin(performance.now() / 150) * 0.06;
      ctx.save(); ctx.translate(W / 2, 330); ctx.scale(k, k); strokedText('Yeni rekor!', 0, 0, 34, '#ff8fb1', 6); ctx.restore();
    }
    bigButton(BTN2, 'Tekrar', '#52b788');
    strokedText('R, Enter ya da Boşluk da olur', W / 2, 486, 18, '#fff6d6', 4);
  }

  function drawPauseOverlay() {
    ctx.fillStyle = 'rgba(30,18,10,0.6)'; ctx.fillRect(0, 0, W, H);
    titleText('Duraklatıldı', W / 2, 220, 74, '#ffd23f');
    strokedText('Devam etmek için P tuşuna bas ya da ekrana dokun', W / 2, 300, 24);
  }

  function drawTouchUI() {
    // duraklat düğmesi
    ctx.save(); outline(3.5);
    ctx.beginPath(); ctx.arc(PAUSE_BTN.x, PAUSE_BTN.y, 20, 0, Math.PI * 2); ctx.fillStyle = '#fff6d6'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.fillRect(PAUSE_BTN.x - 8, PAUSE_BTN.y - 8, 5, 16); ctx.fillRect(PAUSE_BTN.x + 3, PAUSE_BTN.y - 8, 5, 16);
    // şok dalgası düğmesi
    const x = SHOCK_BTN.x, y = SHOCK_BTN.y, full = power >= 100;
    const pul = full ? 1 + Math.sin(performance.now() / 100) * 0.05 : 1;
    ctx.translate(x, y); ctx.scale(pul, pul); ctx.translate(-x, -y);
    ctx.beginPath(); ctx.arc(x, y, 38, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, power / 100));
    ctx.lineWidth = 7; ctx.strokeStyle = full ? '#ffd23f' : '#4bb3e5'; ctx.stroke();
    outline(4);
    ctx.beginPath(); ctx.arc(x, y, 31, 0, Math.PI * 2); ctx.fillStyle = full ? '#ffd23f' : '#e6dccb'; ctx.fill(); ctx.stroke();
    ctx.beginPath();
    [[4, -20], [-10, 2], [-1, 2], [-5, 20], [11, -4], [2, -4]].forEach(([dx, dy], i) => i ? ctx.lineTo(x + dx, y + dy) : ctx.moveTo(x + dx, y + dy));
    ctx.closePath(); ctx.fillStyle = full ? '#ee4b5e' : '#9a8f80'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  // ---------- Ana döngü ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === 'play') { if (!paused) { if (hitStop > 0) hitStop -= dt; else update(dt); } }
    else { t += dt; worldX += (state === 'menu' ? 120 : 0) * dt; if (overT > 0) overT -= dt; }
    if (!(state === 'play' && paused)) fx(dt);
    drawScene();
    if (state === 'play') drawTouchUI();
    if (state === 'play' && paused) drawPauseOverlay();
    else if (state === 'menu') drawMenu();
    else if (state === 'over') drawOver();
    drawSoundIcon();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
